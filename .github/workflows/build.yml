name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - run: npm install
      - run: npm test
      - run: npm run typecheck
        continue-on-error: true   # type warnings do not block the builds; check the log
      - run: npm run build

  android:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Build release APK (unsigned)
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/SocietyManager-debug.apk
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No signing key set: skipping signed release APK"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $UNSIGNED aligned.apk
          $BT/apksigner sign --ks release.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" \
            --out out/SocietyManager-release.apk aligned.apk
          rm -f release.keystore
      - uses: actions/upload-artifact@v7
        with: { name: android-apk, path: out/*.apk }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with: { name: windows-installer, path: release/*.exe }
